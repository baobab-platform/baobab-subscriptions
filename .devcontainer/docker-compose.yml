services:
  workspace:
    image: ghcr.io/baobab-platform/baobab-dev:1.4.4
    command: sleep infinity
    volumes:
      - ..:/workspaces/baobab-subscriptions:cached
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: baobab_subscriptions
      DB_USER: baobab_subscriptions
      DB_PASS: dev-only-password
      # The billing engine expects JDBC, not the libpq URI used previously.
      DATABASE_URL: jdbc:postgresql://postgres:5432/baobab_subscriptions
      DATABASE_USER: baobab_subscriptions
      DATABASE_PASSWORD: dev-only-password
      TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/baobab_subscriptions
      TEST_DATABASE_USER: baobab_subscriptions
      TEST_DATABASE_PASSWORD: dev-only-password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baobab_subscriptions
      POSTGRES_USER: baobab_subscriptions
      POSTGRES_PASSWORD: dev-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baobab_subscriptions -d baobab_subscriptions"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
