schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-subscriptions"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.java"
    - "development.maven"
    - "database.postgresql"
    - "development.docker"
    - "development.github_cli"
notes:
  - "Headless subscription billing engine on Java 21; Kill Bill adapter exists but dispatch is not financially qualified. The pinned baobab-dev:1.4.4 full image presently resolves Java 17 (versions.lock) and is NOT Java-21 build-compatible. baobab-dev issue #52 tracks the required Java 21 workspace profile. Maven enforces release 21; do not claim devcontainer qualification until the actual published image is tested. Engine persistence and CI target PostgreSQL 17."
  - "Codespaces/Dev Containers run as one of docker-compose.yml's services (workspace), with a local Postgres backing service brought up automatically alongside it."
  - "Build and test with the committed Maven wrapper: ./mvnw verify (set TEST_DATABASE_URL=jdbc:postgresql://... to run the PostgreSQL tests)."
