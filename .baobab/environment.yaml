schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-subscriptions"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.java"
    - "development.maven"
    - "database.postgresql"
    - "development.docker"
    - "development.github_cli"
notes:
  - "Headless subscription billing engine on Java 21; Kill Bill adapter exists but dispatch is not financially qualified. The baobab-dev:1.4.4 base image does not itself provide Java 21; the Codespaces configuration layers Java 21 and Maven via a Dev Container feature. Do not claim runtime qualification until the feature build and Maven tests pass. Engine persistence and CI target PostgreSQL 17."
  - "Codespaces/Dev Containers run as one of docker-compose.yml's services (workspace), with PostgreSQL available as an opt-in backing service, not automatically started when the editor opens."
  - "Build and test with the committed Maven wrapper: ./mvnw verify (set TEST_DATABASE_URL=jdbc:postgresql://... to run the PostgreSQL tests)."
