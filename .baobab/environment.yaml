schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-subscriptions"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.java"
    - "development.maven"
    - "database.postgresql"
    - "development.docker"
    - "development.github_cli"
notes:
  - "Headless subscription billing engine (ADR-SUB-0001): a Baobab Billing API on Java 21 with a temporary provider; the Kill Bill adapter is not implemented yet. `full` is the narrowest existing baobab-dev profile with Java, Maven and a PostgreSQL client; the build requires Java 21 (enforced by the Maven enforcer). The engine's own persistence targets PostgreSQL 17."
  - "Codespaces/Dev Containers run as one of docker-compose.yml's services (workspace), with a local Postgres backing service brought up automatically alongside it."
  - "Build and test with the committed Maven wrapper: ./mvnw verify (set TEST_DATABASE_URL=jdbc:postgresql://... to run the PostgreSQL tests)."
